<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>H1.1_Opgave_1 - opdrachten</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 24px;
      background: #f8fafc;
      color: #1f2937;
    }
    h1 { margin-bottom: 16px; }
    h2 { margin-top: 32px; margin-bottom: 8px; }
    ul { list-style: none; padding-left: 0; }
    li { margin-bottom: 8px; }
    a { text-decoration: none; color: #2563eb; }
    a:hover { text-decoration: underline; }

    body.iframe-mode {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: white;
    }
    #opgave-frame {
      display: none;
      width: 100%;
      height: 100vh;
      border: none;
    }
    #error-msg {
      display: none;
      font-family: sans-serif;
      padding: 2rem;
      color: #c0392b;
    }
  </style>
</head>
<body>

  <div id="nav-content">
    <h1>Testomgeving - opdrachten</h1>
    <p>Klik op een opdracht om deze te openen en te testen.</p>

    <h2>Hoofdstuk 1 - Basis mutaties</h2>
    <ul>
      <li><a href="H1.1_Opgave_1.html">Opdracht 1</a></li>
      <li><a href="H1.1_Opgave_2.html">Opdracht 2</a></li>
      <li>Paragraaf 1,5</li>
      <li><a href="H1.5_Opgave_1.html">Opdracht 1</a></li>
    </ul>
  </div>

  <iframe id="opgave-frame" title="Opgave"></iframe>
  <div id="error-msg">❌ Ongeldige opgave opgegeven.</div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const src = params.get('src');

    if (src) {
      const isVeilig = !/^(https?:)?\/\//.test(src) && !src.includes('..');
      if (isVeilig) {
        document.body.classList.add('iframe-mode');
        document.getElementById('nav-content').style.display = 'none';
        const frame = document.getElementById('opgave-frame');
        frame.style.display = 'block';
        frame.src = src;
      } else {
        document.getElementById('nav-content').style.display = 'none';
        document.getElementById('error-msg').style.display = 'block';
      }
    }
  </script>

</body>
</html>
